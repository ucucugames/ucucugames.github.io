<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Ücücü Games</title>
    <style>
        body {
            background-color: #7EEB39;
            font-family: Arial;
        }
        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 50px;
        }
        .left-section img {
            width: 300px;
            border-radius: 20px;
            background: white;
            padding: 10px;
        }
        .right-section {
            display: grid;
            grid-template-columns: repeat(2, 200px);
            gap: 15px;
        }
        .game-button {
            background: linear-gradient(to right, #FFDD55, #FF8844);
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            color: black;
            text-align: center;
        }
        .game-button:hover {
            background: linear-gradient(to right, #FF8844, #FFDD55);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-section">
            <img src="cocacolaespuma.png" alt="Ücücü Games Ayı">
        </div>
        <div class="right-section">
            <a href="/1" class="game-button">Two Player Games Ultra</a>
            <a href="/2" class="game-button">Flapy Ücücü</a>
            <a href="/3" class="game-button">Oco Potat</a>
            <a href="/4" class="game-button">Ücücü İstemedi :)</a>
            <a href="/5" class="game-button">Ücücü İstemedi :)</a>
            <a href="/6" class="game-button">Ücücü İstemedi :)</a>
        </div>
    </div>
</body>
</html>
