<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Ucucu Games</title>
  <style>
    body {
      background-color: #66cc33;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px;
    }
    .left {
      flex: 1;
      text-align: center;
    }
    .left img {
      max-width: 300px;
      height: auto;
    }
    .right {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      padding: 20px;
    }
    .button {
      background: linear-gradient(45deg, orange, gold);
      border: none;
      padding: 20px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s;
      text-align: center;
      text-decoration: none;
      color: black;
    }
    .button:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left">
      <img src="ow.png" alt="Coca Cola Ayıcığı">
    </div>
    <div class="right">
      <a class="button" href="https://scratch.mit.edu/projects/your-project-id/" target="_blank">Two Player Games Ultra</a>
      <a class="button" href="#" onclick="alert('Henüz eklenmedi :)')">Flapy Üçücüü</a>
      <a class="button" href="https://poki.com/en/g/crazy-cars" target="_blank">Crazy Cars</a>
      <div class="button">Ücücü	  İstemedi :)</div>
      <div class="button">Ücücü İstemedi :)</div>
      <div class="button">Ücücü İstemedi :)</div>
      <div class="button">Ücücü İstemedi :)</div>
      <div class="button">Ücücü İstemedi :)</div>
    </div>
  </div>
</body>
</html>
