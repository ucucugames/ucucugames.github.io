<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>UcucuGames</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background-color: #28a745; /* yeşil arka plan */
    display: flex;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #000;
  }
  .left-panel {
    background-color: #28a745;
    width: 25%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
    border-radius: 10px 0 0 10px;
  }
  .left-panel img {
    max-width: 100%;
    max-height: 80vh;
    object-fit: contain;
    background-color: transparent;
    cursor: pointer; /* Tıklanabilir göster */
  }
  .right-panel {
    width: 75%;
    padding: 20px;
    box-sizing: border-box;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-gap: 15px;
    align-content: center;
    justify-content: center;
  }
  .box {
    background-color: #fff;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100px;
    font-size: 1.2rem;
    font-weight: 600;
    text-align: center;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    padding: 10px;
    user-select: none;
  }
  .box.button {
    cursor: pointer;
    background-color: #d49528;
    color: #000;
    font-weight: 700;
    transition: background-color 0.3s ease;
  }
  .box.button:hover {
    background-color: #d49528;
    color: #fff;
  }
</style>
</head>
<body>

<div class="left-panel">
  <img src="https://ucucugames.github.io/cocacolaespuma.png" id="ucucuImage" alt="Ucucu Resim" />
</div>

<div class="right-panel">
  <a href="/1" class="box">Two Player Games Ultra</a>
  <div class="box">Flapy Ücücü</div>
  <div class="box">Oco Potat</div>
  <div class="box">Ücücü İstemedi 😎</div>
  <div class="box">Ücücü İstemedi 😎</div>
  <div class="box">Ücücü İstemedi 😎</div>
  <div class="box">Ücücü İstemedi 😎</div>
  <div class="box">Ücücü İstemedi 😎</div>
  <div class="box">Ücücü İstemedi 😎</div>
</div>

<audio id="ucucuAudio" preload="auto">
  <source src="/ucucu.mp3" type="audio/mpeg" />
  Tarayıcınız audio elementini desteklemiyor.
</audio>

<script>
  const ucucuImage = document.getElementById('ucucuImage');
  const ucucuAudio = document.getElementById('ucucuAudio');

  ucucuImage.addEventListener('click', () => {
    ucucuAudio.pause();
    ucucuAudio.currentTime = 0;
    ucucuAudio.play().catch(e => console.error('Ses çalma hatası:', e));
  });
</script>

</body>
</html>
